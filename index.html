
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #d32f2f;
            font-size: 28px;
            margin: 10px 0 20px;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 9px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-group input[type="button"],
        .input-group button {
            background-color: #d32f2f;
            color: white;
            cursor: pointer;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-group input[type="button"]:hover,
        .input-group button:hover {
            background-color: #b71c1c;
        }

        /* Refund fields layout */
        .refund-row {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 32px;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .refund-row input {
            width: 100%;
            min-width: 0;
            padding: 9px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Remove button */
        .remove-btn {
            background-color: #888;
            color: white;
            border: none;
            border-radius: 4px;
            width: 32px;
            height: 35px;
            padding: 0;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background-color: #555;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }

        .result {
            margin-top: 15px;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
        }

        /* Mobile responsiveness */
        @media (max-width: 400px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Refund Calculator</h1>

    <!-- Refund Fields -->
    <div id="refundFieldsContainer">

        <div class="refund-row">
            <input
                type="number"
                step="0.01"
                min="0"
                class="refund-amount"
                placeholder="Enter refund amount"
            >

            <input
                type="number"
                step="1"
                min="0"
                class="refund-quantity"
                placeholder="Quantity"
            >

            <button
                type="button"
                class="remove-btn"
                onclick="removeRefundField(this)"
                title="Remove refund field"
            >✕</button>
        </div>

    </div>

    <!-- Add More Fields -->
    <div class="input-group">
        <button type="button" onclick="addRefundFields()">
            + Add More Refund Fields
        </button>
    </div>

    <!-- Order Information -->
    <div class="input-group">
        <label for="subtotal">Subtotal ($):</label>
        <input
            type="number"
            id="subtotal"
            step="0.01"
            min="0"
            placeholder="Enter subtotal"
        >
    </div>

    <div class="input-group">
        <label for="promoDiscount">Promo Discount ($):</label>
        <input
            type="number"
            id="promoDiscount"
            step="0.01"
            min="0"
            placeholder="Enter promo discount (if any)"
        >
    </div>

    <div class="input-group">
        <label for="serviceFee">Service Fee ($):</label>
        <input
            type="number"
            id="serviceFee"
            step="0.01"
            min="0"
            placeholder="Enter service fee"
        >
    </div>

    <div class="input-group">
        <label for="salesTax">Sales Tax ($):</label>
        <input
            type="number"
            id="salesTax"
            step="0.01"
            min="0"
            placeholder="Enter sales tax (if any)"
        >
    </div>

    <div class="input-group">
        <label for="customerPaid">Customer Paid ($):</label>
        <input
            type="number"
            id="customerPaid"
            step="0.01"
            min="0"
            placeholder="Enter amount paid"
        >
    </div>

    <!-- Calculate Button -->
    <div class="input-group">
        <input
            type="button"
            value="Calculate Refund"
            onclick="calculateRefund()"
        >
    </div>

    <!-- Messages and Results -->
    <div id="errorMessage" class="error" role="alert"></div>
    <div id="result" class="result" aria-live="polite"></div>

</div>

<script>

    // ADD REFUND FIELDS
    function addRefundFields() {

        const container = document.getElementById('refundFieldsContainer');

        const currentFields =
            container.querySelectorAll('.refund-row').length;

        if (currentFields >= 20) {
            document.getElementById('errorMessage').innerText =
                'Maximum of 20 refund fields allowed.';
            return;
        }

        document.getElementById('errorMessage').innerText = '';

        const newRefundField = document.createElement('div');

        newRefundField.classList.add('refund-row');

        newRefundField.innerHTML = `
            <input
                type="number"
                step="0.01"
                min="0"
                class="refund-amount"
                placeholder="Enter refund amount"
            >

            <input
                type="number"
                step="1"
                min="0"
                class="refund-quantity"
                placeholder="Quantity"
            >

            <button
                type="button"
                class="remove-btn"
                onclick="removeRefundField(this)"
                title="Remove refund field"
            >✕</button>
        `;

        container.appendChild(newRefundField);
    }


    // REMOVE REFUND FIELDS
    function removeRefundField(button) {

        const container =
            document.getElementById('refundFieldsContainer');

        const fields = container.querySelectorAll('.refund-row');

        if (fields.length <= 1) {

            // Keep at least one refund field.
            const row = button.closest('.refund-row');

            row.querySelector('.refund-amount').value = '';
            row.querySelector('.refund-quantity').value = '';

        } else {

            // Remove only the selected refund field.
            button.closest('.refund-row').remove();

        }

        document.getElementById('errorMessage').innerText = '';
        document.getElementById('result').innerHTML = '';
    }


    // CALCULATE REFUND
    function calculateRefund() {

        const getValue = (id) =>
            document.getElementById(id).value.trim();

        const subtotal = parseFloat(getValue('subtotal'));
        const promoDiscount = parseFloat(getValue('promoDiscount')) || 0;
        const serviceFee = parseFloat(getValue('serviceFee'));
        const salesTax = parseFloat(getValue('salesTax')) || 0;
        const customerPaid = parseFloat(getValue('customerPaid'));

        const errorMessage =
            document.getElementById('errorMessage');

        const result =
            document.getElementById('result');

        errorMessage.innerText = '';
        result.innerHTML = '';

        // Validate numeric fields
        if (
            !Number.isFinite(subtotal) ||
            !Number.isFinite(serviceFee) ||
            !Number.isFinite(customerPaid) ||
            !Number.isFinite(promoDiscount) ||
            !Number.isFinite(salesTax)
        ) {
            errorMessage.innerText =
                'Please enter valid numeric values in all required fields.';
            return;
        }

        // Validate positive values
        if (
            subtotal <= 0 ||
            promoDiscount < 0 ||
            serviceFee < 0 ||
            salesTax < 0 ||
            customerPaid < 0
        ) {
            errorMessage.innerText =
                'Please enter positive values only.';
            return;
        }

        // Calculate effective paid amount
        const effectivePaidAmount = subtotal - promoDiscount;

        if (effectivePaidAmount <= 0) {
            errorMessage.innerText =
                'Promo discount must be less than the subtotal.';
            return;
        }

        let totalRefund = 0;

        // Get all active refund fields
        const refundRows =
            document.querySelectorAll('.refund-row');

        for (let i = 0; i < refundRows.length; i++) {

            const refundAmountRaw =
                refundRows[i]
                    .querySelector('.refund-amount')
                    .value.trim();

            const quantityRaw =
                refundRows[i]
                    .querySelector('.refund-quantity')
                    .value.trim();

            // Skip completely empty fields
            if (refundAmountRaw === '' && quantityRaw === '') {
                continue;
            }

            const refundAmount = parseFloat(refundAmountRaw);
            const quantity = Number(quantityRaw);

            // Validate refund amount and quantity
            if (
                refundAmountRaw === '' ||
                quantityRaw === '' ||
                !Number.isFinite(refundAmount) ||
                !Number.isInteger(quantity) ||
                refundAmount < 0 ||
                quantity < 0
            ) {
                errorMessage.innerText =
                    `Please enter a valid refund amount and whole-number quantity in refund field ${i + 1}.`;
                return;
            }

            totalRefund += refundAmount * quantity;
        }

        if (totalRefund <= 0) {
            errorMessage.innerText =
                'Please enter at least one refund amount and quantity greater than zero.';
            return;
        }

        // Calculate refund ratio
        const refundRatio =
            totalRefund / effectivePaidAmount;

        // Calculate proportional service fee
        const proportionalServiceFee =
            Math.round((serviceFee * refundRatio) * 100) / 100;

        // Calculate proportional sales tax
        const proportionalSalesTax =
            Math.round((salesTax * refundRatio) * 100) / 100;

        // Add proportional amounts to refund
        totalRefund +=
            proportionalServiceFee + proportionalSalesTax;

        const refundRatioPercentage =
            (refundRatio * 100).toFixed(2);

        // Display results
        result.innerHTML = `
            <strong>Total Partial Refund:</strong>
            $${totalRefund.toFixed(2)}<br>

            <strong>Refund Ratio:</strong>
            ${refundRatio.toFixed(4)}
            (${refundRatioPercentage}%)<br>

            <strong>Proportional Service Fee:</strong>
            $${proportionalServiceFee.toFixed(2)}<br>

            <strong>Proportional Sales Tax:</strong>
            $${proportionalSalesTax.toFixed(2)}
        `;

    }

</script>

</body>
</html>
